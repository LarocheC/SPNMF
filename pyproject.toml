[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spnmf"
version = "0.2.0"
description = "Harmonic/percussive source separation with Structured Projective NMF"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "audio source separation",
    "harmonic percussive separation",
    "nonnegative matrix factorization",
    "projective nmf",
    "music information retrieval",
]
authors = [{ name = "Clement Laroche" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
spnmf = "spnmf.cli:main"

[project.urls]
Homepage = "https://github.com/LarocheC/SPNMF"
"Original MATLAB code" = "https://github.com/LarocheC/voice-extraction"
"Journal manuscript" = "https://github.com/LarocheC/Journal_SPNMF"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]
